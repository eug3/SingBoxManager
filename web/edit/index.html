<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>规则编辑台 · Vault Console</title>
<style>
:root{--bg:#05070d;--panel:#0b101c;--line:#1b2740;--ink:#c9d6f0;--dim:#5b6b8c;
--acc:#37e0a0;--acc2:#4fc3ff;--warn:#ffb347;--bad:#ff5f6d;
--mono:"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 70px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);
background:var(--panel);padding:14px 18px;margin-bottom:14px}
.top h1{font-size:16px;letter-spacing:2px;color:#eaf2ff}
.top h1 b{color:var(--acc)}
.key{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.key input{background:#0d1524;border:1px solid var(--line);color:var(--acc);font-family:var(--mono);
padding:6px 10px;width:170px;font-size:12px}
.banner{border:1px solid var(--warn);color:var(--warn);background:#1a1408;padding:10px 14px;
margin-bottom:12px;font-size:12px;display:none}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:9px 18px;cursor:pointer;font-size:13px}
.tab.on{border-color:var(--acc);color:var(--acc)}
.pane{display:none}.pane.on{display:block}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{border:1px solid var(--line);background:var(--panel);padding:10px 16px;min-width:130px}
.stat b{display:block;font-size:16px;color:#eaf2ff;font-weight:400}
.stat span{font-size:10px;color:var(--dim);letter-spacing:1px}
h2{font-size:12px;color:var(--dim);letter-spacing:3px;margin:20px 0 10px;font-weight:400}
h2::before{content:"◈ "}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.gcard{border:1px solid var(--line);background:var(--panel);padding:12px 14px}
.gcard .gn{display:flex;justify-content:space-between;align-items:center}
.gcard .gn .nm{font-size:14px;color:#eaf2ff}
.gcard .now{font-size:11px;color:var(--acc);margin:5px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#0d1524;color:var(--dim);padding:3px 9px;
font-size:11px;cursor:pointer;font-family:var(--mono)}
.chip:hover{border-color:var(--acc2);color:var(--acc2)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip .ms{color:var(--warn);margin-left:4px}
.chip .bad{color:var(--bad);margin-left:4px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar input{background:#0d1524;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);
padding:7px 10px;font-size:12px;flex:1;min-width:200px}
button{font-family:var(--mono);font-size:12px;background:#0d1524;color:var(--acc2);
border:1px solid var(--line);padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--acc2)}
button.acc{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{color:var(--dim);text-align:left;font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid #121b2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
tr:hover td{background:#0d1524}
.ch{color:var(--acc2)}.dl{color:var(--acc)}.x{color:var(--bad);cursor:pointer}
.ebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,textarea{background:#0d1524;border:1px solid var(--line);color:var(--ink);font-family:var(--mono)}
select{padding:7px 10px;font-size:12px}
textarea{width:100%;height:380px;padding:14px;font-size:12px;line-height:1.7;color:#a8ffd9;
resize:vertical;tab-size:2}
textarea.err{border-color:var(--bad)}
.ev{font-size:11px;line-height:1.9}
.ev .ok{color:var(--acc)}.ev .no{color:var(--bad)}.ev .dim{color:var(--dim)}
.result{border:1px solid var(--acc);background:rgba(55,224,160,.06);padding:12px 16px;margin-top:12px;font-size:12px;display:none}
.result .cd{color:var(--warn);font-size:15px}
.foot{margin-top:34px;color:#3d4a66;font-size:10px;line-height:2;border-top:1px dashed var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>规则编辑台 <b>◈ VAULT CONSOLE</b></h1>
    <div class="key">访问密钥 <input type="password" id="key" placeholder="与路由 Clash API 相同"></div>
  </div>
  <div class="banner" id="oguard">⚠ 请从 <b>http://192.168.31.8:888/edit/</b> 访问以启用全部功能（当前来源不受信，路由与发布接口将被浏览器拦截）</div>
  <div class="tabs">
    <div class="tab" data-p="r32" onclick="sw('r32')">🛰️ 甲 · 主干</div>
    <div class="tab" data-p="rgl" onclick="sw('rgl')">📡 乙 · 侧翼</div>
    <div class="tab" data-p="edit" onclick="sw('edit')">🧩 规则编辑</div>
  </div>

  <div class="pane" id="p-r32"></div>
  <div class="pane" id="p-rgl"></div>

  <div class="pane" id="p-edit">
    <div class="ebar">
      <select id="bucket" onchange="loadBucket()"></select>
      <button onclick="loadBucket()">重新拉取</button>
      <button onclick="fmt()">格式化</button>
      <button class="acc" onclick="publish()">保存并发布 →</button>
      <span class="ev dim" id="liveinfo"></span>
    </div>
    <textarea id="src" spellcheck="false" oninput="validate()"></textarea>
    <div class="ev" id="vstat"></div>
    <div class="result" id="pres"></div>
    <div class="foot">
      发布链路：浏览器 → 99号机编译(sing-box) → 写入 NAS → 两台路由 60s 内自动拉取 · 全程零重启<br>
      语义提醒：桶内条目是「或」关系；同名序号桶（-2/-3）是在原位保序的影子桶，改它们不影响主桶<br>
      服务端会拒绝：非法桶名 / 非 rules[] 结构 / 未知字段 —— 校验通过才会写盘
    </div>
  </div>
</div>
<script>
const R32={name:'甲 · 主干',api:'http://192.168.31.32:9090'};
const RGL={name:'乙 · 侧翼',api:'http://172.16.8.1:9090'};
const PUB='http://192.168.31.99:9099/publish';
const LAN_ORIGIN='http://192.168.31.8:888';
const BUCKETS=[['rs-node',13],['rs-direct',17],['rs-fcm',5],['rs-custom',12],['rs-openai',9],
['rs-custom-2',1],['rs-balance',1],['rs-openai-2',1],['rs-iplc',1],['rs-custom-3',1],
['rs-fish',1],['rs-node-2',2],['rs-direct-2',1],['rs-gdirect',9],['rs-block',2],
['rs-purify',8],['rs-direct-3',1],['rs-msft',2],['rs-apple',3],['rs-tg',2],
['rs-media',58],['rs-node-3',14],['rs-gdirect-2',7],['bard-domains',1]];
if(location.origin!==LAN_ORIGIN)document.getElementById('oguard').style.display='block';
const $=id=>document.getElementById(id);
const key=()=>($('key').value||'').trim();
$('key').value=localStorage.getItem('vaultKey')||'';
$('key').onchange=()=>$('key').value&&localStorage.setItem('vaultKey',$('key').value);

let curPane='r32';
function sw(p){curPane=p;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===p));
document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));$('p-'+p).classList.add('on');
if(p==='r32')renderR(R32,'p-r32');if(p==='rgl')renderR(RGL,'p-rgl');}
sw('r32');

function api(r,path,method,body){
  return fetch(r.api+path,{method:method||'GET',
    headers:Object.assign({'Authorization':'Bearer '+key()},body?{'Content-Type':'application/json'}:{}),
    body:body?JSON.stringify(body):undefined});
}
async function renderR(r,pid){
  const el=$(pid);
  el.innerHTML='<div class="strip"><div class="stat"><span>状态</span><b>加载中…</b></div></div>';
  let ver,proxies,conns;
  try{
    const [vr,pr,cr]=await Promise.all([
      api(r,'/version'),api(r,'/proxies'),api(r,'/connections')]);
    if(vr.status===401||pr.status===401){
      el.innerHTML='<div class="banner" style="display:block">✗ 密钥未填或错误（401）—— 右上角填入与 Clash API 相同的访问密钥后自动重试</div>';return}
    ver=await vr.json();proxies=await pr.json();conns=await cr.json();
  }catch(e){el.innerHTML='<div class="banner" style="display:block">✗ 连不上 '+r.api+'：'+e.message+'（检查密钥 / 是否在 888 来源打开）</div>';return}
  const P=proxies.proxies||{};
  const groups=Object.values(P).filter(x=>['Selector','URLTest'].includes(x.type));
  const cl=conns.connections||[];
  let up=0,dn=0;cl.forEach(c=>{up+=c.upload||0;dn+=c.download||0});
  const mb=n=>(n/1048576).toFixed(1)+' MB';
  el.innerHTML=`
  <div class="strip">
    <div class="stat"><span>引擎</span><b style="font-size:12px">${ver.version||'—'}</b></div>
    <div class="stat"><span>活跃连接</span><b>${cl.length}</b></div>
    <div class="stat"><span>流量 ↓/↑</span><b style="font-size:13px">${mb(conns.downloadTotal||dn)} / ${mb(conns.uploadTotal||up)}</b></div>
    <div class="stat"><span>分组</span><b>${groups.length}</b></div>
    <div class="stat"><span>角色</span><b style="font-size:13px">${r.name}</b></div>
  </div>
  <h2>分组与节点 · 点成员即切换</h2>
  <div class="ggrid">${groups.map(g=>`
    <div class="gcard">
      <div class="gn"><span class="nm">${g.name}</span><span class="dim" style="font-size:10px">${g.type}</span></div>
      <div class="now">▸ ${g.now||'—'}</div>
      <div class="chips">${g.all.map(m=>`<span class="chip ${m===g.now?'on':''}" title="点击切换"
        onclick="pick('${r.api}','${esc(g.name)}','${esc(m)}',this)">${esc(m)}</span>`).join('')}</div>
    </div>`).join('')}
  </div>
  <h2>连接表</h2>
  <div class="bar"><input placeholder="过滤：域名 / 链 / 规则…" oninput="filt('${pid}',this.value)">
  <button onclick="sw(curPane)">刷新</button>
  <span class="dim" style="font-size:10px">↑↓ 为连接流量 · ✕ 断开</span></div>
  <div style="overflow-x:auto"><table><thead><tr>
    <th>主机</th><th>目标</th><th>链</th><th>规则</th><th>↑</th><th>↓</th><th></th>
  </tr></thead><tbody id="${pid}-tb">${connRows(cl)}</tbody></table></div>`;
  el.dataset.loaded='1';
}
let _curR=null;
function connRows(cl){
  return cl.slice().sort((a,b)=>(b.start||'').localeCompare(a.start||'')).slice(0,80).map(c=>{
    const m=c.metadata||{};
    return `<tr><td class="ch">${esc(m.host||'')}</td><td class="dim">${m.destinationIP||''}:${m.destinationPort||''}</td>
    <td class="dl">${esc((c.chains||[]).slice().reverse().join('>')||'')}</td>
    <td class="dim">${esc(c.rule||'')} ${esc(c.rulePayload||'')}</td>
    <td class="dim">${fmtB(c.upload)}</td><td class="dim">${fmtB(c.download)}</td>
    <td><span class="x" onclick="kill('${c.id}')">✕</span></td></tr>`;}).join('');
}
function filt(pid,q){q=(q||'').toLowerCase();
  document.querySelectorAll('#'+pid+' tbody tr').forEach(tr=>{
    tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none';});}
async function kill(id){for(const r of [R32,RGL]){try{await api(r,'/connections/'+id,'DELETE')}catch(e){}}}
async function pick(apiBase,g,m,chipEl){
  const r=apiBase===R32.api?R32:RGL;
  try{
    const resp=await api(r,'/proxies/'+encodeURIComponent(g),'PUT',{name:m});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    chipEl.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
    chipEl.classList.add('on');
    chipEl.closest('.gcard').querySelector('.now').textContent='▸ '+m;
  }catch(e){alert('切换失败：'+e.message)}
  try{const d=await api(r,'/proxies/'+encodeURIComponent(m)+'/delay?timeout=3000&url='+encodeURIComponent('http://www.gstatic.com/generate_204')).then(x=>x.json());
    if(d.delay)chipEl.innerHTML=esc(m)+'<span class="ms">'+d.delay+'ms</span>';
    else chipEl.innerHTML=esc(m)+'<span class="bad">✗</span>';
  }catch(e){chipEl.innerHTML=esc(m)+'<span class="bad">✗</span>'}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtB(n){n=n||0;return n>1048576?(n/1048576).toFixed(1)+'M':n>1024?(n/1024).toFixed(0)+'K':n}

/* ── 编辑台 ── */
const sel=$('bucket');
BUCKETS.forEach(([b,n])=>{const o=document.createElement('option');o.value=b;o.textContent=`${b}（${n} 条规则）`;sel.appendChild(o)});
sel.value='rs-tg';
loadBucket();
async function loadBucket(){
  $('src').value='加载中…';
  try{$('src').value=await(await fetch(`../rule-set/${sel.value}.json`,{cache:'no-store'})).text();}
  catch(e){$('src').value='拉取失败：'+e}
  try{const h=await fetch(`../rule-set/${sel.value}.srs`,{method:'HEAD',cache:'no-store'});
    $('liveinfo').textContent=`线上: ${h.headers.get('content-length')}B · ${h.headers.get('last-modified')||''}`;}catch(e){}
  validate();
}
const RKEYS=new Set(['domain','domain_suffix','domain_keyword','ip_cidr']);
function validate(){
  const t=$('src');const v=t.value;
  let msg='',ok=false,stats={entries:0,kinds:{}};
  try{
    const j=JSON.parse(v);
    const rules=j.rules;
    if(!Array.isArray(rules)||!rules.length)msg='rules[] 必须是非空数组';
    else{let bad=null;
      for(const r of rules){
        const ks=Object.keys(r);
        if(!ks.length){bad='存在空规则';break}
        const unk=ks.filter(k=>!RKEYS.has(k));
        if(unk.length){bad='未知字段: '+unk.join(',');break}
        for(const [k,val] of Object.entries(r)){
          if(!Array.isArray(val)||!val.length||!val.every(x=>typeof x==='string'&&x)){bad=k+' 必须是非空字符串数组';break}
          stats.entries+=val.length;stats.kinds[k]=(stats.kinds[k]||0)+val.length;
        }
        if(bad)break;
      }
      if(!bad){ok=true;msg=`✓ 合法 · ${rules.length} 条规则 / ${stats.entries} 条目 · `+
        Object.entries(stats.kinds).map(([k,n])=>k+'×'+n).join(' · ');}
      else msg='✗ '+bad;
    }
  }catch(e){const m=e.message.match(/position (\d+)/);msg='✗ JSON 语法错误: '+e.message+(m?`（第 ${v.slice(0,+m[1]).split('\n').length} 行附近）`:'')}
  t.classList.toggle('err',!ok);
  $('vstat').innerHTML=`<span class="${ok?'ok':'no'}">${msg}</span>`+(ok?'':'<span class="dim"> —— 修正后才能发布</span>');
  return ok;
}
function fmt(){try{$('src').value=JSON.stringify(JSON.parse($('src').value),null,2);validate()}catch(e){}}
async function publish(){
  if(!validate())return alert('内容不合法，未发布');
  if(!key())return alert('请先在右上角填访问密钥');
  const res=$('pres');res.style.display='block';
  res.innerHTML='<span class="dim">发布中：编译 → 写入 NAS → …</span>';
  try{
    const r=await fetch(PUB,{method:'POST',
      headers:{'Content-Type':'application/json','X-Vault-Key':key()},
      body:JSON.stringify({bucket:sel.value,content:$('src').value})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    let s=60;
    res.innerHTML=`✓ 已发布 <b>${j.bucket}</b> · json ${j.json}B · srs ${j.srs}B · sha256 <span class="dl">${j.sha256}…</span><br>
      <span class="cd" id="cd">60</span> 秒后两台路由自动生效（无需任何操作）
      <button onclick="loadBucket()" style="margin-left:10px">重新拉取确认</button>`;
    const cd=()=>$('cd')&&($('cd').textContent=--s>0?s:0);
    const iv=setInterval(()=>{cd();if(s<=0){clearInterval(iv);}},1000);
  }catch(e){res.innerHTML=`<span style="color:var(--bad)">✗ 发布失败：${esc(e.message)}</span>`}
}
</script>
</body>
</html>
